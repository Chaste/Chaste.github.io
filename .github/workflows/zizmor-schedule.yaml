name: Audit workflows with zizmor

on:
  schedule:
    - cron: '15 3 * * 1'  # Every Monday at 03:15 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Generate SARIF for code scanning
        run: |
          uvx zizmor --format sarif .github/workflows > results.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: zizmor

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## zizmor findings"
            echo '```'
            uvx zizmor --color never .github/workflows || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate findings and fail if any were found
        run: |
          uvx zizmor --format github .github/workflows
