name: Audit workflows with zizmor

on:
  schedule:
    - cron: '15 3 * * 1'  # Every Monday at 03:15 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Generate SARIF for code scanning
        run: |
          uvx zizmor --format sarif .github/workflows > results.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
          category: zizmor

      - name: Annotate findings and fail if any were found
        run: |
          uvx zizmor --format github .github/workflows
