name: Audit workflows with zizmor

on:
  schedule:
    - cron: '15 3 * * 1'  # Every Monday at 03:15 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run zizmor
        run: |
          uvx zizmor --format sarif .github/workflows > results.sarif
        continue-on-error: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: zizmor

      - name: Generate summary
        if: always()
        run: |
          uvx zizmor .github/workflows > findings.txt || true
          {
            echo "## zizmor findings"
            echo '```'
            cat findings.txt
            echo '```'
            echo
            echo "Full details: https://github.com/${{ github.repository }}/security/code-scanning?query=is%3Aopen"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if findings were reported
        run: |
          count=$(jq '[.runs[].results[]] | length' results.sarif)
          if [ "$count" -gt 0 ]; then
            echo "zizmor reported $count finding(s) — see step summary or the Security tab."
            exit 1
          fi
