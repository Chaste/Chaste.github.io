name: Check links on PRs

on:

  pull_request:
    branches: ["**"]

  push:
    branches: ["main"]
    
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:

    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.144.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install LinkChecker
        run: |
          pip install --upgrade pip setuptools wheel
          pip install linkchecker

      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
          hugo version

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          
      - name: Build site
        run: |
          npm install
          hugo --baseURL="http://localhost:8002"
        working-directory: site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          TZ: Europe/London

      - name: Serve site and run LinkChecker
        run: |
          python -m http.server 8002 --directory site/public/ > /dev/null 2>&1 &
          sleep 2
          linkchecker --config=".linkcheckerrc" --timeout=120 --threads=4 http://localhost:8002/
          
      - name: Generate summary
        if: always()
        run: |
          bash generate-summary.sh
          cat broken-links.md > $GITHUB_STEP_SUMMARY
