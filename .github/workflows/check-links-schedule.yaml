name: Check links on schedule

on:
  schedule:
    - cron: '48 2 * * 0'  # Every Sunday at 02:48 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install LinkChecker
        run: |
          pip install --upgrade pip setuptools wheel
          pip install linkchecker

      - name: Run LinkChecker
        run: |
          linkchecker --config=".linkcheckerrc" --timeout=120 --threads=4 https://chaste.github.io/
          
      - name: Generate summary
        if: always()
        run: |
          bash generate-summary.sh
          cat broken-links.md > $GITHUB_STEP_SUMMARY
