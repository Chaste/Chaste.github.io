name: Check links on schedule

on:
  schedule:
    - cron: '48 2 * * 0'  # Every Sunday at 02:48 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install LinkChecker
        run: |
          pip install --upgrade pip setuptools wheel
          pip install linkchecker

      - name: Run LinkChecker
        run: |
          linkchecker --config=".linkcheckerrc" --timeout=120 --threads=4 https://chaste.github.io/
          
      - name: Generate summary
        if: always()
        run: |
          bash generate-summary.sh
          cat broken-links.md > $GITHUB_STEP_SUMMARY
