{{ define "main" }}
<section class="section container-fluid mt-n3 pb-3">
  <div class="row justify-content-center">
    <div class="col-lg-12 text-center">
      <!-- <h1 class="mt-0">{{ .Title }}</h1> -->
      <div class="chaste-logo-homepage">
        <img src="chaste_1024.png" alt="Chaste logo">
      </div>
    </div>
    <div class="col-lg-9 col-xl-8 text-center">
      <p class="lead">{{ .Params.lead | markdownify | safeHTML }}</p>
      <a class="btn btn-primary btn-lg px-4 mb-2" href="/docs/{{ if .Site.Params.options.docsVersioning }}{{ .Site.Params.docsVersion }}/{{ end }}prologue/introduction/" role="button">Get Started</a>
      <p class="meta">Open-source BSD Licensed. <a href="https://github.com/Chaste/Chaste/releases/tag/release_2021.1">GitHub v2021.1</a></p>
    </div>
  </div>
</section>
{{ end }}

{{ define "sidebar-prefooter" }}

{{ end }}

{{ define "sidebar-footer" }}
<section class="section section-sm container-fluid">
  <div class="row justify-content-center text-center">
    <div class="col-lg-9">
      {{- .Content -}}
    </div>
  </div>
</section>
{{ end }}
